runConfig:
  runtime: nodejs20
  
  # CPU and memory configuration
  cpu: 1
  memoryMiB: 512
  
  # Minimum and maximum instances
  minInstances: 0
  maxInstances: 4
  
  # Concurrency
  concurrency: 80

  # Allow unauthenticated access (public web app)
  invoker: public

  env:
    # ========================================
    # DATABASE (CRITICAL - Required for Prisma)
    # ========================================
    - variable: DATABASE_URL
      secret: DATABASE_URL
      availability:
        - BUILD
        - RUNTIME

    # ========================================
    # AI API Keys (Server-side) - Secured via Secret Manager
    # ========================================
    - variable: GEMINI_API_KEY
      secret: GEMINI_API_KEY
      availability:
        - BUILD
        - RUNTIME
    
    # ========================================
    # Backend Service URLs
    # ========================================
    - variable: NEXT_PUBLIC_BACKEND_URL
      secret: NEXT_PUBLIC_BACKEND_URL
      availability:
        - BUILD
        - RUNTIME