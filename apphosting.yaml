runConfig:
  runtime: nodejs20
  
  # CPU and memory configuration
  cpu: 1
  memoryMiB: 512
  
  # Minimum and maximum instances
  minInstances: 0
  maxInstances: 4
  
  # Concurrency
  concurrency: 80

  # Allow unauthenticated access (public web app)
  invoker: public

  env:
    # ========================================
    # DATABASE (CRITICAL - Required for Prisma)
    # ========================================
    - variable: DATABASE_URL
      secret: DATABASE_URL
      availability:
        - BUILD
        - RUNTIME
    
    # ========================================
    # AI API Keys - Fallback for complex operations (file uploads, etc.)
    # Most routes use Vertex AI, but this is kept for backward compatibility
    # Available at BUILD time for Next.js route initialization
    # ========================================
    - variable: GEMINI_API_KEY
      secret: GEMINI_API_KEY
      availability:
        - BUILD
        - RUNTIME
    
    # ========================================
    # Firebase Client Configuration (Public)
    # These MUST be available at BUILD time for Next.js
    # ========================================
    - variable: NEXT_PUBLIC_FIREBASE_API_KEY
      value: AIzaSyD8pa4S7Kbyq_r96L9fRXomLNlCSJA28LU
      availability:
        - BUILD
        - RUNTIME
    
    - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
      value: pravartak-15665.firebaseapp.com
      availability:
        - BUILD
        - RUNTIME
    
    - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
      value: pravartak-15665
      availability:
        - BUILD
        - RUNTIME
    
    - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
      value: pravartak-15665.firebasestorage.app
      availability:
        - BUILD
        - RUNTIME
    
    - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
      value: "393621785566"
      availability:
        - BUILD
        - RUNTIME
    
    - variable: NEXT_PUBLIC_FIREBASE_APP_ID
      value: 1:393621785566:web:44c4f82cb61b6dbe73ab4f
      availability:
        - BUILD
        - RUNTIME
    
    # ========================================
    # Backend Service URLs
    # ========================================
    - variable: NEXT_PUBLIC_BACKEND_URL
      value: https://pravartak-backend-w5mkanjiva-uc.a.run.app
      availability:
        - BUILD
        - RUNTIME
    
    # ========================================
    # Google Cloud Configuration for Vertex AI
    # ========================================
    - variable: GOOGLE_CLOUD_PROJECT_ID
      value: pravartak-15665
      availability:
        - BUILD
        - RUNTIME
    
    - variable: GCP_PROJECT_ID
      value: pravartak-15665
      availability:
        - BUILD
        - RUNTIME
    
    - variable: GOOGLE_CLOUD_REGION
      value: us-central1
      availability:
        - BUILD
        - RUNTIME
    
    # ========================================
    # Google Cloud Credentials (if needed for Speech-to-Text)
    # ========================================
    - variable: GOOGLE_APPLICATION_CREDENTIALS
      secret: GOOGLE_APPLICATION_CREDENTIALS
      availability:
        - RUNTIME