    <rect x="340" y="320" width="220" height="95" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="450" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">💬 AI Cover Letters</text>
