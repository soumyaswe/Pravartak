  <text x="620" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1e293b">Students</text>
  <circle cx="800" cy="165" r="4" fill="#0284c7"/>
  <text x="820" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1e293b">Professionals</text>
