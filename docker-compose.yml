version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pravartak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pravartak_user
      POSTGRES_PASSWORD: pravartak_password
      POSTGRES_DB: pravartak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pravartak_user -d pravartak"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

